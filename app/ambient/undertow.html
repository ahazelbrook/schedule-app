<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const R=(a,b)=>a+(b-a)*Math.random();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
// one loop (default ~30fps, the fps option lowers it), paused while hidden; step(dt, clock)
let last=performance.now(),acc=0,clock=0,run=!document.hidden;const steps=[];
const loop=fn=>steps.push(fn);
function frame(now){if(!run)return;const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
 if(acc>=1/30){const d=reduce?acc*.5:acc;clock+=d;for(const f of steps)f(d,clock);acc=0;}requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(frame);}});
if(navigator.wakeLock){const lock=()=>navigator.wakeLock.request("screen").catch(()=>{});lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock();});}

const Motion=(()=>{const figs={};
 function idx(id){if(figs[id])return figs[id];const root=document.querySelectorAll('[data-fig="'+id+'"]');const pts=[];
  root.forEach(r=>r.querySelectorAll('[data-mv]').forEach(p=>{const vs=[];for(const c of p.children)vs.push({el:c,f:c.getAttribute('data-f')});pts.push(vs);}));
  return figs[id]={pts,cur:0};}
 function show(id,k){const F=idx(id);if(F.cur===k)return;const key=' '+k+' ';
  for(const vs of F.pts)for(const v of vs){const on=v.f.indexOf(key)>=0;const d=on?'':'none';if(v.el.style.display!==d)v.el.style.display=d;}F.cur=k;}
 function play(id,seq){return new Promise(res=>{let i=0;const next=()=>{if(i>=seq.length)return res();const [k,ms]=seq[i++];show(id,k);setTimeout(next,ms);};next();});}
 return {show,play};})();

const every=(a,b,fn,first)=>{let t=first!=null?first:R(a,b);loop(dt=>{t-=dt;if(t<=0){t=R(a,b);fn();}});};
const busy={};const move=(id,seq)=>{if(busy[id])return Promise.resolve();busy[id]=1;return Motion.play(id,seq).then(()=>{busy[id]=0;});};

const wheels=[...document.querySelectorAll('.wheel')].map(g=>({g,cx:+g.dataset.cx,cy:+g.dataset.cy,v:+g.dataset.v,b:[...g.querySelectorAll('.blob')].map(c=>({c,r:+c.dataset.r,ph:+c.dataset.ph}))}));
const specks=[...document.querySelectorAll('#specks rect')].map(e=>({e,a:+e.dataset.a,d:+e.dataset.d,y:+e.dataset.y}));
const bobs=[...document.querySelectorAll('.bob')].map(g=>({g,x:+g.dataset.x,y:+g.dataset.y,s:+g.dataset.s,ph:+g.dataset.ph}));
const tiles=[...document.querySelectorAll('.tile')];const neon=$('neon');
const BPM=118, beat=60/BPM;
loop((dt,c)=>{
 for(const w of wheels){w.g.setAttribute('transform','rotate('+(c*w.v).toFixed(2)+' '+w.cx+' '+w.cy+')');for(const b of w.b)b.c.setAttribute('r',(b.r*(1+Math.sin(c*.4+b.ph)*.18)).toFixed(1));}
 for(const s of specks){const a=s.a+c*.25;const x=560+Math.cos(a)*s.d;const y=120+s.y*600+Math.sin(a*2)*20;s.e.setAttribute('x',x.toFixed(0));s.e.setAttribute('y',y.toFixed(0));s.e.style.display=(Math.cos(a)>-.2)?'':'none';}
 const ph=(c/beat)%1;
 for(const b of bobs){const k=Math.max(0,Math.sin((c/beat)*Math.PI*2+b.ph));b.g.setAttribute('transform','translate('+b.x+' '+(b.y-k*14).toFixed(1)+') scale('+b.s+')');}
 if(Math.random()<.02){const t=tiles[Math.floor(Math.random()*tiles.length)];t.setAttribute('opacity',(.15+Math.random()*.7).toFixed(2));}
 neon.setAttribute('opacity',Math.random()<.004?'.25':'1');
});
// the dancers: a four-frame groove on the beat, in turn
let n1=0,n2=2;every(beat*2,beat*2,()=>{n1=(n1+1)%4;Motion.show('dancer1',n1);},0);
every(beat*2,beat*2,()=>{n2=(n2+3)%4;Motion.show('dancer2',n2);},beat);
// Mira sips, now and then
every(10,24,()=>move('mira',[[1,160],[2,1800],[1,160],[0,0]]),6);

requestAnimationFrame(frame);
})();
</script>
