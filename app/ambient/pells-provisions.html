<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const R=(a,b)=>a+(b-a)*Math.random();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
// one loop (default ~30fps, the fps option lowers it), paused while hidden; step(dt, clock)
let last=performance.now(),acc=0,clock=0,run=!document.hidden;const steps=[];
const loop=fn=>steps.push(fn);
function frame(now){if(!run)return;const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
 if(acc>=1/24){const d=reduce?acc*.5:acc;clock+=d;for(const f of steps)f(d,clock);acc=0;}requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(frame);}});
if(navigator.wakeLock){const lock=()=>navigator.wakeLock.request("screen").catch(()=>{});lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock();});}

const Motion=(()=>{const figs={};
 function idx(id){if(figs[id])return figs[id];const root=document.querySelectorAll('[data-fig="'+id+'"]');const pts=[];
  root.forEach(r=>r.querySelectorAll('[data-mv]').forEach(p=>{const vs=[];for(const c of p.children)vs.push({el:c,f:c.getAttribute('data-f')});pts.push(vs);}));
  return figs[id]={pts,cur:0};}
 function show(id,k){const F=idx(id);if(F.cur===k)return;const key=' '+k+' ';
  for(const vs of F.pts)for(const v of vs){const on=v.f.indexOf(key)>=0;const d=on?'':'none';if(v.el.style.display!==d)v.el.style.display=d;}F.cur=k;}
 function play(id,seq){return new Promise(res=>{let i=0;const next=()=>{if(i>=seq.length)return res();const [k,ms]=seq[i++];show(id,k);setTimeout(next,ms);};next();});}
 return {show,play};})();

const every=(a,b,fn,first)=>{let t=first!=null?first:R(a,b);loop(dt=>{t-=dt;if(t<=0){t=R(a,b);fn();}});};
const busy={};const move=(id,seq)=>{if(busy[id])return Promise.resolve();busy[id]=1;return Motion.play(id,seq).then(()=>{busy[id]=0;});};

const drops=[...document.querySelectorAll('#prain line')].map(l=>({l,x:+l.dataset.x,y:+l.dataset.y}));
const tail=$('tail'),tube=$('tube'),tl=$('tubelight'),dim=$('dim'),fly=$('fly'),dial=$('dial'),notes=$('notes'),pass=$('ppass');
let flick=0;
loop((dt,c)=>{
 for(const d of drops){d.y+=700*dt;if(d.y>760){d.y=170;d.x=60+Math.random()*400;}d.l.setAttribute('transform','translate('+d.x.toFixed(1)+' '+d.y.toFixed(1)+')');}
 tail.setAttribute('transform','rotate('+(Math.sin(c*1.3)*6+(Math.sin(c*.23)>.9?Math.sin(c*9)*10:0)).toFixed(1)+' -86 -8)');
 fly.setAttribute('cx',(900+Math.cos(c*2.1)*90+Math.sin(c*5.3)*20).toFixed(1));fly.setAttribute('cy',(115+Math.sin(c*2.7)*26).toFixed(1));
 dial.setAttribute('transform','translate('+(Math.sin(c*.05)*20+20).toFixed(1)+' 0)');
 notes.setAttribute('opacity',(Math.max(0,Math.sin(c*.8))*.5).toFixed(2));notes.setAttribute('transform','translate('+(Math.sin(c*.8)*10).toFixed(1)+' '+(-((c*14)%40)).toFixed(1)+')');
 if(flick>0){flick-=dt;const on=Math.random()<.5;tube.setAttribute('opacity',on?1:.3);tl.setAttribute('opacity',on?1:.2);dim.setAttribute('opacity',on?0:.35);if(flick<=0){tube.setAttribute('opacity',1);tl.setAttribute('opacity',1);dim.setAttribute('opacity',0);}}
});
every(18,45,()=>{flick=R(.3,1.2);},6);
every(35,90,()=>{let x=-200;const step=()=>{x+=6;pass.setAttribute('transform','translate('+x+' 0)');if(x<700)setTimeout(step,40);};step();},12);

requestAnimationFrame(frame);
})();
