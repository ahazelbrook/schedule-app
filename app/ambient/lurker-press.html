<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const R=(a,b)=>a+(b-a)*Math.random();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
// one loop (default ~30fps, the fps option lowers it), paused while hidden; step(dt, clock)
let last=performance.now(),acc=0,clock=0,run=!document.hidden;const steps=[];
const loop=fn=>steps.push(fn);
function frame(now){if(!run)return;const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
 if(acc>=1/24){const d=reduce?acc*.5:acc;clock+=d;for(const f of steps)f(d,clock);acc=0;}requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(frame);}});
if(navigator.wakeLock){const lock=()=>navigator.wakeLock.request("screen").catch(()=>{});lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock();});}

const Motion=(()=>{const figs={};
 function idx(id){if(figs[id])return figs[id];const root=document.querySelectorAll('[data-fig="'+id+'"]');const pts=[];
  root.forEach(r=>r.querySelectorAll('[data-mv]').forEach(p=>{const vs=[];for(const c of p.children)vs.push({el:c,f:c.getAttribute('data-f')});pts.push(vs);}));
  return figs[id]={pts,cur:0};}
 function show(id,k){const F=idx(id);if(F.cur===k)return;const key=' '+k+' ';
  for(const vs of F.pts)for(const v of vs){const on=v.f.indexOf(key)>=0;const d=on?'':'none';if(v.el.style.display!==d)v.el.style.display=d;}F.cur=k;}
 function play(id,seq){return new Promise(res=>{let i=0;const next=()=>{if(i>=seq.length)return res();const [k,ms]=seq[i++];show(id,k);setTimeout(next,ms);};next();});}
 return {show,play};})();

const every=(a,b,fn,first)=>{let t=first!=null?first:R(a,b);loop(dt=>{t-=dt;if(t<=0){t=R(a,b);fn();}});};
const busy={};const move=(id,seq)=>{if(busy[id])return Promise.resolve();busy[id]=1;return Motion.play(id,seq).then(()=>{busy[id]=0;});};

const HL=[["FOG HOLDS BARGES AT THE DOCKS","Limmerfield men ‘not available for enquiries’"],["CHASE ON CANDLE BRIDGE","City Watch ‘monitoring the situation’"],["BLUETIME RUNS SHORT AGAIN","Ministry of Discovery: ‘within tolerances’"],["SPEAKERS OFF APPLE LANE, TRADERS TOLD","Record shops defiant: ‘We were here first’"],["STRANGFORD-MICHTER POSTS RECORD YEAR","Daylight futures up four points"],["CURFEW EXTENDED IN CROWFOOT","City Watch cites ‘activity’"],["DEATH RADAR SILENT FOR THIRD NIGHT","Section 6 declines to comment"],["BONEYARD CATCH ‘BEST IN YEARS’","Fishmongers report a glut of oil"],["COUNCIL DEBATES BUBBLE LEVY","Vote deferred to the new year"],["MINISTRY DENIES SHORTAGE OF SUN","‘There is plenty of sun,’ says spokesman"]];let hi=0;
const drums=[...document.querySelectorAll('.drum')].map(g=>({g,x:+g.dataset.x,y:+g.dataset.y,v:+g.dataset.v}));
const sheets=[...document.querySelectorAll('.sheet')].map(e=>({e,o:+e.dataset.o}));
const page=$('page'),hl=$('hl'),sub=$('sub'),gauge=$('gauge');
function fit(){hl.removeAttribute('textLength');hl.removeAttribute('lengthAdjust');try{if(hl.getComputedTextLength()>520){hl.setAttribute('textLength','520');hl.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}}
fit();
loop((dt,c)=>{
 for(const d of drums)d.g.setAttribute('transform','rotate('+((c*d.v*57)%360).toFixed(1)+' '+d.x+' '+d.y+')');
 for(const s of sheets){const x=1300+((c*120+s.o)%320);s.e.setAttribute('x',x.toFixed(0));}
 gauge.setAttribute('transform','rotate('+(30+Math.sin(c*2.3)*8+Math.random()*3).toFixed(1)+')');
});
// a new front page: it drops onto the stack with a hard cut and a little settle
every(12,26,()=>move('pressman',[[1,160],[2,2200],[1,160],[0,0]]),5);
every(9,14,async()=>{hi=(hi+1)%HL.length;page.setAttribute('transform','translate(0 -40)');page.style.opacity='0';await new Promise(r=>setTimeout(r,180));
 hl.textContent=HL[hi][0];sub.textContent=HL[hi][1];fit();page.style.opacity='1';
 for(const [y,ms] of [[-40,60],[-12,60],[4,70],[0,0]]){page.setAttribute('transform','translate(0 '+y+') rotate('+(y/20).toFixed(2)+' 800 960)');await new Promise(r=>setTimeout(r,ms));}},8);

requestAnimationFrame(frame);
})();
