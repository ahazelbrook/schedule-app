<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning board</title>
<style>
@font-face{font-family:"Archivo Condensed";src:url(../fonts/ArchivoCondensed-Variable.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"GT America";src:url(../fonts/GTAmericaArabic-Regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"GT America";src:url(../fonts/GTAmericaArabic-Bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Space Mono";src:url(../fonts/SpaceMono-Regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Space Mono";src:url(../fonts/SpaceMono-Bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Courier Prime";src:url(../fonts/CourierPrime-Regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Courier Prime";src:url(../fonts/CourierPrime-Bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Yellowtail";src:url(../fonts/Yellowtail-Regular.woff2) format("woff2");font-weight:400;font-display:block}
html,body{margin:0;height:100%;background:#3a2a18;overflow:hidden}
body{container-type:size}
/* the scene fills its frame; the board is drawn whole inside it, any shape of frame (the tech run, 06/11: the 4:3 cover cut a portrait iPad's site in half) */
.stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;background-size:224px;opacity:.12;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(8,7,10,.55) 100%);pointer-events:none}
#world{will-change:transform}.string{stroke-dasharray:1 1;stroke-dashoffset:1}
</style></head>
<body>
<div class="stage" id="stage">
<svg class="layer" id="world" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <filter id="cork" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.13" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 -2.2 1.25"/></filter>
    <radialGradient id="lamp" cx="760" cy="460" r="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd27a" stop-opacity=".12"/><stop offset=".55" stop-color="#1a1208" stop-opacity=".25"/><stop offset="1" stop-color="#0d0905" stop-opacity=".72"/></radialGradient>
  </defs>
  <g id="cam">
    <rect x="-600" y="-900" width="2800" height="3000" fill="#a27445"/>
    <rect x="-600" y="-900" width="2800" height="3000" filter="url(#cork)" opacity=".9"/>
    <g id="content"></g>
    <rect x="-600" y="-900" width="2800" height="3000" fill="url(#lamp)"/>
  </g>
</svg>
<div id="vig"></div>
<div id="grain"></div>
</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const R=(a,b)=>a+(b-a)*Math.random();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
// one loop at ~30fps, paused while hidden; step(dt, clock)
let last=performance.now(),acc=0,clock=0,run=!document.hidden;const steps=[];
const loop=fn=>steps.push(fn);
function frame(now){if(!run)return;const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
 if(acc>=1/30){const d=reduce?acc*.5:acc;clock+=d;for(const f of steps)f(d,clock);acc=0;}requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(frame);}});
if(navigator.wakeLock){const lock=()=>navigator.wakeLock.request("screen").catch(()=>{});lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock();});}

// grain: the same 224px noise tile the baked scenes carried, drawn at load instead of shipped (PRNG and alpha curve from grain.js)
try{const N=224,cv=document.createElement("canvas");cv.width=cv.height=N;const cx=cv.getContext("2d"),img=cx.createImageData(N,N);
 let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=r(),o=(y*N+x)*4,g=v<.5?0:255;img.data[o]=img.data[o+1]=img.data[o+2]=g;img.data[o+3]=Math.floor(Math.pow(Math.abs(v-.5)*2,2.2)*255);}
 cx.putImageData(img,0,0);$("grain").style.backgroundImage="url("+cv.toDataURL("image/png")+")";}catch(e){}

// ---- received SVG: parsed, checked, cleaned, imported. Never assigned as markup. ----
const MAX=8e6;
function parseSvg(str){
 if(typeof str!=="string"||!str||str.length>MAX)return null;
 let doc;try{doc=new DOMParser().parseFromString(str,"image/svg+xml");}catch(e){return null;}
 if(!doc||doc.getElementsByTagName("parsererror").length)return null;
 const root=doc.documentElement;if(!root||root.localName!=="svg")return null;
 const node=document.importNode(root,true);
 // belt and braces on top of the server and sender checks: no scripts, no handlers, no external references
 for(const n of [node,...node.querySelectorAll("*")]){
  const t=n.localName.toLowerCase();
  if(t==="script"||t==="foreignobject"||t==="iframe"||t==="object"||t==="embed"){if(n!==node)n.remove();continue;}
  for(const a of [...n.attributes]){const k=a.name.toLowerCase();
   if(k.startsWith("on"))n.removeAttribute(a.name);
   else if(k==="href"||k==="xlink:href"){const v=a.value.trim();if(!(v[0]==="#"||/^data:image\//i.test(v)))n.removeAttribute(a.name);}}
 }
 return node;
}
function viewBox(node){
 const vb=(node.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number);
 return vb.length===4&&vb.every(isFinite)&&vb[2]>0&&vb[3]>0?vb:null;
}
// a nested <svg> holding the received svg's children, at x/y/w/h with the received viewBox
function nest(node,vb,x,y,w,h,parent){
 const n=el("svg",{x:x,y:y,width:w,height:h,viewBox:vb.join(" ")},parent);
 while(node.firstChild)n.appendChild(node.firstChild);
 return n;
}
const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild);};

const W=1600,H=1200,content=$("content"),cam=$("cam");
let pols=[],strings=[],timers=[],gen=0;
const T=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id;};

// a slow drift across the board: never still, never fast. The camera keeps the whole sheet (and the crew's polaroids) in view: its scale comes from the
// frame's shape and what is pinned up, with room for the drift and the breathing zoom (the tech run, 06/11), and is worked out again on a resize
const AX=44,AY=28,WOB=.03;let box={x:800,y:600,w:1220,h:864},base=1.1;
function visible(){const w=innerWidth||4,h=innerHeight||3,a=w/h;return a>=4/3?{hw:600*a,hh:600}:{hw:800,hh:800/a};}
function fit(){const v=visible();base=Math.min(1.16,.96*v.hw/(box.w/2+AX),.96*v.hh/(box.h/2+AY))/(1+WOB);}
addEventListener("resize",fit);fit();
// the camera eases to a new box (a pin added makes the board taller) rather than jumping; snap() puts it there at once (a first board, or held still)
let cv={x:box.x,y:box.y,s:base};
function snap(){cv={x:box.x,y:box.y,s:base};cam.setAttribute("transform","translate(800 600) scale("+base.toFixed(4)+") translate("+(-box.x).toFixed(1)+" "+(-box.y).toFixed(1)+")");}
loop((dt,t)=>{const k=Math.min(1,dt*1.4);cv.x+=(box.x-cv.x)*k;cv.y+=(box.y-cv.y)*k;cv.s+=(base-cv.s)*k;
 const x=Math.sin(t*2*Math.PI/97)*AX*.8+Math.sin(t*2*Math.PI/41)*AX*.2, y=Math.sin(t*2*Math.PI/73+1)*AY*.8+Math.cos(t*2*Math.PI/37)*AY*.2, s=cv.s*(1+Math.sin(t*2*Math.PI/131)*WOB);
 cam.setAttribute("transform","translate(800 600) scale("+s.toFixed(4)+") translate("+(-cv.x+x).toFixed(1)+" "+(-cv.y+y).toFixed(1)+")");});
// polaroids lift a little in a draught
loop((dt,t)=>{for(const p of pols){const a=Math.sin(t*p.sp+p.ph)*.6+Math.sin(t*p.sp*2.3+p.ph)*.25;p.e.setAttribute("transform",p.base.replace(/rotate\([^)]*\)/,"rotate("+(p.rot+a).toFixed(2)+")"));}});

// the red string is pinned up one length at a time, then now and then taken down and pinned again
function pin(s,ms){s.style.transition="stroke-dashoffset "+ms+"ms cubic-bezier(.6,.1,.3,1)";s.style.strokeDashoffset="0";}
function repin(g){if(g!==gen||!strings.length)return;const s=strings[Math.floor(Math.random()*strings.length)];
 s.style.transition="stroke-dashoffset 1800ms ease-in";s.style.strokeDashoffset="-1";
 T(()=>{s.style.transition="none";s.style.strokeDashoffset="1";requestAnimationFrame(()=>requestAnimationFrame(()=>{if(g===gen)pin(s,3200);}));},2600);
 T(()=>repin(g),R(70,140)*1000);}

function teardown(){gen++;for(const id of timers)clearTimeout(id);timers=[];pols=[];strings=[];clear(content);}

const POL_ROT=[-4,3,-2,5];
function show(d){
 const board=parseSvg(d.board),vb=board&&viewBox(board);
 if(!board||!vb)return;
 const pw=176,ph=228,crew=[];
 for(const p of (Array.isArray(d.polaroids)?d.polaroids.slice(0,8):[])){
  if(!p||typeof p!=="object")continue;
  const n=parseSvg(p.svg),pv=n&&viewBox(n);
  if(!n||!pv)continue;
  crew.push({n:n,pv:pv,cap:typeof p.cap==="string"?p.cap.slice(0,60):""});
 }
 teardown();
 // the kit draws its own cork (the first two full-size rects): the page has one cork under everything
 const full=[...board.children].filter(c=>c.localName==="rect"&&c.getAttribute("width")==="100%"&&c.getAttribute("height")==="100%");
 const a=full.find(c=>c.hasAttribute("fill")&&!c.hasAttribute("filter")),b=full.find(c=>c.hasAttribute("filter"));
 if(a)a.remove();
 if(b)b.remove();
 // red string: mark it so the page can pin it up
 let n=0;
 for(const p of board.querySelectorAll("path")){
  if(p.getAttribute("stroke")!=="#a51d16")continue;
  const c=p.getAttribute("class");
  p.setAttribute("class",c?c+" string":"string");p.setAttribute("data-i",n++);p.setAttribute("pathLength","1");
 }
 const bw=1220,bh=bw*vb[3]/vb[2],bx=(W-bw)/2+20,by=120;
 const sheet=nest(board,vb,bx,by,bw,bh,content);
 // masking tape on the sheet's corners
 el("rect",{x:bx+160,y:by+30,width:120,height:30,fill:"#e8dfc4",opacity:".8",transform:"rotate(-12 "+(bx+220)+" "+(by+45)+")"},content);
 el("rect",{x:bx+bw-520,y:by+10,width:110,height:28,fill:"#e8dfc4",opacity:".8",transform:"rotate(9 "+(bx+bw-465)+" "+(by+24)+")"},content);
 // the crew as polaroids along the bottom of the board
 crew.forEach((c,i)=>{
  const x=380+i*270+(i%2?14:-8),y=by+bh-70+(i%2?16:0),rot=POL_ROT[i%4];
  const tf="translate("+x+" "+y+") rotate("+rot+")";
  const g=el("g",{"class":"pol","data-rot":rot,transform:tf},content);
  el("rect",{x:-pw/2+5,y:9,width:pw,height:ph,fill:"#000",opacity:".3"},g);
  el("rect",{x:-pw/2,y:0,width:pw,height:ph,fill:"#f6f2e8"},g);
  nest(c.n,c.pv,-pw/2+14,14,pw-28,(pw-28)*c.pv[3]/c.pv[2],g);
  const t=el("text",{x:0,y:ph-13,"text-anchor":"middle","font-family":"Yellowtail","font-size":24,fill:"#2a2521"},g);
  t.textContent=c.cap;
  el("circle",{cx:0,cy:10,r:8,fill:"#a8210f"},g);
  el("circle",{cx:-2.5,cy:7.5,r:3,fill:"#e03a20"},g);
  pols.push({e:g,base:tf,rot:rot,ph:R(0,6),sp:R(.5,.8)});
 });
 // what the camera keeps in view: the sheet, and the polaroids hanging off its foot
 const foot=crew.length?Math.max(by+bh,by+bh-70+16+9+ph):by+bh;
 box={x:bx+bw/2,y:(by+foot)/2,w:bw+40,h:foot-by};fit();
 strings=[...content.querySelectorAll(".string")];
 const g0=gen,held=still();
 // the board's pins (the GM's planning board): a card drawn for a pin carries an id pb-<pin>-...; the same site sent again keeps what was pinned
 // where it was, still, and only a card whose pin is new arrives (large in the middle, readable, then down to its place, then its string)
 const same=d.name===prev.name&&prev.name!==null,cards=cardsOf(sheet),keys=new Set(cards.filter(c=>c.key).map(c=>c.key));
 const fresh=same?cards.filter(c=>c.key&&!prev.keys.has(c.key)):[];
 prev={name:d.name,keys:keys};
 if(!same||held)snap();
 if(!same)strings.forEach((s,i)=>T(()=>{if(g0===gen)pin(s,2600);},1500+i*2200));
 else{
  const mine=new Map(strings.map(s=>[s,owner(s,cards)]));
  strings.forEach(s=>{if(fresh.indexOf(mine.get(s))<0){s.style.transition="none";s.style.strokeDashoffset="0";}});
  fresh.forEach((c,i)=>arrive(c,strings.filter(s=>mine.get(s)===c),vb,400+i*6400,g0,held));
 }
 T(()=>repin(g0),R(60,90)*1000);
}
let prev={name:null,keys:new Set()};
const still=()=>reduce||document.documentElement.classList.contains("b68-fx-off");
// the cards on the board: the top-level groups the kit placed with translate(x y), each starting with its shadow rect (its size)
function cardsOf(root){const out=[];
 for(const g of root.children){
  if(g.localName!=="g")continue;
  const m=/^translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(g.getAttribute("transform")||""),r=g.firstElementChild;
  if(!m||!r||r.localName!=="rect")continue;
  const w=+r.getAttribute("width"),h=+r.getAttribute("height");if(!(w>0&&h>0))continue;
  const p=g.querySelector('[id^="pb-"]'),k=p&&/^pb-([a-z0-9]+)-/.exec(p.id);
  out.push({g:g,x:+m[1],y:+m[2],w:w,h:h,key:k?k[1]:""});
 }
 return out;}
// a string starts at its card's pin, near the card's top right corner: the nearest card owns it
function owner(s,cards){const m=/^M\s*([-\d.]+)[ ,]+([-\d.]+)/.exec(s.getAttribute("d")||"");if(!m)return null;
 let best=null,bd=1e9;for(const c of cards){const dd=Math.hypot(c.x+c.w-m[1],c.y-m[2]);if(dd<bd){bd=dd;best=c;}}return best;}
// a new pin arrives: the card drops in large in the middle of the board (dimmed behind it), holds, settles into its place, then its string is pinned.
// Held still or reduced motion: it is simply there, string and all
function arrive(c,strs,vb,at,g0,held){
 strs.forEach(s=>{s.style.transition="none";s.style.strokeDashoffset=held?"0":"1";});
 if(held)return;
 const par=c.g.parentNode,next=c.g.nextSibling,wrap=el("g",{"class":"arrive"});
 const s=Math.min(6,.55*vb[3]/c.h,.42*vb[2]/c.w),tx=vb[0]+vb[2]/2-(c.x+c.w/2)*s,ty=vb[1]+vb[3]/2-(c.y+c.h/2)*s;
 const big=dy=>"translate("+tx.toFixed(2)+"px,"+(ty+dy).toFixed(2)+"px) scale("+s.toFixed(3)+")";
 const dim=el("rect",{x:vb[0],y:vb[1],width:vb[2],height:vb[3],fill:"#0d0905"},par);
 dim.style.opacity="0";par.appendChild(wrap);wrap.appendChild(c.g);
 wrap.style.transformOrigin="0 0";wrap.style.transform=big(-vb[3]*.2);wrap.style.opacity="0";
 T(()=>{if(g0!==gen)return;dim.style.transition="opacity 500ms";dim.style.opacity=".5";wrap.style.transition="transform 800ms cubic-bezier(.2,.9,.3,1.12),opacity 250ms linear";wrap.style.transform=big(0);wrap.style.opacity="1";},at);
 T(()=>{if(g0!==gen)return;dim.style.opacity="0";wrap.style.transition="transform 1300ms cubic-bezier(.55,.05,.3,1)";wrap.style.transform="translate(0px,0px) scale(1)";},at+800+3600);
 T(()=>{if(g0!==gen)return;par.insertBefore(c.g,next);wrap.remove();dim.remove();strs.forEach(x=>pin(x,2200));},at+800+3600+1400);
}

// ---- protocol: ask the parent for the score; accept it only from the parent, on this origin ----
if(parent!==window){
 addEventListener("message",e=>{
  if(!(e.source === parent && e.origin === location.origin && e.data && e.data.type === "b68:score"))return;
  try{show(e.data);}catch(err){}
 });
 try{parent.postMessage({type:"b68:ready"},location.origin);}catch(e){}
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
