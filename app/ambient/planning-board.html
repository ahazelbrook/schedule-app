<html lang="en"><head><meta charset="utf-8">

<style>

html,body{margin:0;height:100%;background:#3a2a18;overflow:hidden}
body{container-type:size}
/* the scene fills its frame; the board is drawn whole inside it, any shape of frame (the tech run, 06/11: the 4:3 cover cut a portrait iPad's site in half) */
.stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;background-size:224px;opacity:.12;mix-blend-mode:overlay;pointer-events:none}

</style></head>
<body>
<div class="stage" id="stage">
<svg class="layer" id="world" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <filter id="cork" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.13" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 -2.2 1.25"/></filter>
    <radialGradient id="lamp" cx="760" cy="460" r="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd27a" stop-opacity=".12"/><stop offset=".55" stop-color="#1a1208" stop-opacity=".25"/><stop offset="1" stop-color="#0d0905" stop-opacity=".72"/></radialGradient>
  </defs>
  <g id="cam">
    <rect x="-600" y="-900" width="2800" height="3000" fill="#a27445"/>
    <rect x="-600" y="-900" width="2800" height="3000" filter="url(#cork)" opacity=".9"/>
    <g id="content"></g>
    <rect x="-600" y="-900" width="2800" height="3000" fill="url(#lamp)"/>
  </g>
</svg>
<div id="vig"></div>
<div id="grain"></div>
</div>
<script>
(()=>{"use strict";

// a nested <svg> holding the received svg's children, at x/y/w/h with the received viewBox

const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild);};

const W=1600,H=1200,content=$("content"),cam=$("cam");

const T=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id;};

// a slow drift across the board: never still, never fast. The camera keeps the whole sheet (and the crew's polaroids) in view: its scale comes from the
// frame's shape and what is pinned up, with room for the drift and the breathing zoom (the tech run, 06/11), and is worked out again on a resize
const AX=44,AY=28,WOB=.03;let box={x:800,y:600,w:1220,h:864},base=1.1,fill=false,lastD=null,refit=0;

// polaroids lift a little in a draught
loop((dt,t)=>{for(const p of pols){const a=Math.sin(t*p.sp+p.ph)*.6+Math.sin(t*p.sp*2.3+p.ph)*.25;p.e.setAttribute("transform",p.base.replace(/rotate\([^)]*\)/,"rotate("+(p.rot+a).toFixed(2)+")"));}});

function repin(g){if(g!==gen||!strings.length)return;const s=strings[Math.floor(Math.random()*strings.length)];

 T(()=>{s.style.transition="none";s.style.strokeDashoffset="1";requestAnimationFrame(()=>requestAnimationFrame(()=>{if(g===gen)pin(s,3200);}));},2600);
 T(()=>repin(g),R(70,140)*1000);}

function teardown(){gen++;for(const id of timers)clearTimeout(id);timers=[];pols=[];strings=[];clear(content);}

// the players' screen puts the camera on its frame at once (held still, the loop never runs)
function snap(){cam.setAttribute("transform","translate(800 600) scale("+base.toFixed(4)+") translate("+(-box.x).toFixed(1)+" "+(-box.y).toFixed(1)+")");}

// as big cards in the cork either side of it, each strung to the point on its room the kit strung it to. The kit's own small index cards (the
// ways in, any threat) and their strings and pins come off: the way-in tags drawn ON the sheet stay. The page fills its frame exactly (no drift).

 // each card hangs on the side nearest its room; a side holds four, and the cards nearest the middle go over to the other side
 const mid=sx+sw/2,ex=p=>p.end?p.end[0]:mid,L=[],Rt=[];

 el("rect",{x:X0+Sw*.12,y:Y0+Sh*.035,width:Sw*.09,height:Sh*.03,fill:"#e8dfc4",opacity:".8",transform:"rotate(-12 "+(X0+Sw*.165)+" "+(Y0+Sh*.05)+")"},content);
 el("rect",{x:X0+Sw*.74,y:Y0+Sh*.02,width:Sw*.085,height:Sh*.028,fill:"#e8dfc4",opacity:".8",transform:"rotate(9 "+(X0+Sw*.78)+" "+(Y0+Sh*.034)+")"},content);
 const cardG=el("g",{"class":"pcards"},content),strG=el("g",{},content),endG=el("g",{},content),placed=[];
 [[L,true],[Rt,false]].forEach(([list,left])=>{
  const tot=list.length*A*C+(list.length-1)*gap;
  list.forEach((p,i)=>{
   const x=left?pad:Bw-pad-C,y=(Bh-tot)/2+i*(A*C+gap),rot=(i%2?1:-1)*(left?1.4:-1.2);

   const fin="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) rotate("+rot+"deg)";
   g.style.transformOrigin="0 0";g.style.transform=fin;
   el("rect",{x:C*.025,y:C*.04,width:C,height:A*C,fill:"#000",opacity:".35"},g);
   p.img.setAttribute("x","0");p.img.setAttribute("y","0");p.img.setAttribute("width",C.toFixed(1));p.img.setAttribute("height",(A*C).toFixed(1));p.img.setAttribute("preserveAspectRatio","xMidYMid slice");
   g.appendChild(p.img);
   if(p.face&&p.cap)caption(g,p.cap,C,A);

   el("circle",{cx:hx,cy:hy,r:C*.04,fill:"#a8210f"},g);el("circle",{cx:hx-C*.012,cy:hy-C*.012,r:C*.014,fill:"#e03a20"},g);
   let s=null;
   if(p.end){const grp=fan.get(p.end.join(",")),j=grp.indexOf(p),[px0,py0]=toC(p.end[0],p.end[1]),px=px0+(j-(grp.length-1)/2)*Bh*.014,py=py0-Bh*.022,ax=x+hx,ay=y+hy,/* never steeper than flat at the card: it leaves its own card sideways, clear of the cards above and below */sag=Math.min(Bh*.05,Math.hypot(px-ax,py-ay)*.12);
    s=el("path",{d:"M"+ax.toFixed(1)+" "+ay.toFixed(1)+" Q"+((ax+px)/2).toFixed(1)+" "+Math.max(ay,(ay+py)/2+sag).toFixed(1)+" "+px.toFixed(1)+" "+py.toFixed(1),fill:"none",stroke:"#a51d16","stroke-width":Math.max(2.5,Bh*.0032).toFixed(2),"stroke-linecap":"round","class":"string",pathLength:"1"},strG);
    el("circle",{cx:px.toFixed(1),cy:py.toFixed(1),r:Math.max(3,Bh*.005).toFixed(1),fill:"#c22f1c"},endG);}
   placed.push({key:p.key,g:g,fin:fin,C:C,s:s});
  });
 });
 box={x:Bw/2,y:Bh/2,w:Bw,h:Bh};fit();snap();
 strings=[...content.querySelectorAll(".string")];
 const g0=gen,held=still(),same=d.name===prev.name&&prev.name!==null;
 // new pins (and any whose arrival a re-send cut short) arrive one after another; at most the last four move, the rest are simply there
 if(!same||held)landQ.clear();
 const fresh=same?placed.filter(p=>!prev.keys.has(p.key)||landQ.has(p.key)):[],moving=held?[]:fresh.slice(-4);

 else{
  strings.forEach(s=>{if(!moving.some(p=>p.s===s)){s.style.transition="none";s.style.strokeDashoffset="0";}});
  moving.forEach((p,i)=>{landQ.add(p.key);land(p,Bw,Bh,400+i*6400,g0,held,cardG);});

// a new pin on the players' screen: in large in the middle (1.6 times its place, the board dimmed), held, then a move and a shrink into its place,
// then its string. Held still or reduced motion: simply there
const landQ=new Set();
// a face's caption: the name the players know, on one line, or two split at a space, set as large as the card is wide (never cut, never past the card)
function caption(g,cap,C,A){

}
function land(p,Bw,Bh,at,g0,held,cardG){
 if(p.s){p.s.style.transition="none";p.s.style.strokeDashoffset=held?"0":"1";}
 if(held)return;

 dim.style.opacity="0";content.appendChild(p.g);p.g.classList.add("landing");
 p.g.style.transform=big.replace("px) scale","px) translate(0px,-"+(Bh*.06).toFixed(0)+"px) scale");p.g.style.opacity="0";
 T(()=>{if(g0!==gen)return;dim.style.transition="opacity 500ms";dim.style.opacity=".5";p.g.style.transition="transform 800ms cubic-bezier(.2,.9,.3,1.12),opacity 250ms linear";p.g.style.transform=big;p.g.style.opacity="1";},at);
 T(()=>{if(g0!==gen)return;dim.style.opacity="0";p.g.style.transition="transform 1300ms cubic-bezier(.55,.05,.3,1)";p.g.style.transform=p.fin;},at+800+3600);

let prev={name:null,keys:new Set()};
// held still: the page holding this scene still turns transitions off from outside (the scene never knows how); a transition asked for that
// does not take is the sign, so the new pin is simply there

// the cards on the board: the top-level groups the kit placed with translate(x y), each starting with its shadow rect (its size)
function cardsOf(root){const out=[];

  if(g.localName!=="g")continue;
  const m=/^translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(g.getAttribute("transform")||""),r=g.firstElementChild;
  if(!m||!r||r.localName!=="rect")continue;

  out.push({g:g,x:+m[1],y:+m[2],w:w,h:h,key:k?k[1]:""});

// a string starts at its card's pin, near the card's top right corner: the nearest card owns it
function owner(s,cards){const m=/^M\s*([-\d.]+)[ ,]+([-\d.]+)/.exec(s.getAttribute("d")||"");if(!m)return null;

function show(d){

 // masking tape on the sheet's corners
 el("rect",{x:bx+160,y:by+30,width:120,height:30,fill:"#e8dfc4",opacity:".8",transform:"rotate(-12 "+(bx+220)+" "+(by+45)+")"},content);
 el("rect",{x:bx+bw-520,y:by+10,width:110,height:28,fill:"#e8dfc4",opacity:".8",transform:"rotate(9 "+(bx+bw-465)+" "+(by+24)+")"},content);
 // the crew as polaroids along the bottom of the board
 crew.forEach((c,i)=>{
  const x=380+i*270+(i%2?14:-8),y=by+bh-70+(i%2?16:0),rot=POL_ROT[i%4];
  const tf="translate("+x+" "+y+") rotate("+rot+")";
  const g=el("g",{"class":"pol","data-rot":rot,transform:tf},content);
  el("rect",{x:-pw/2+5,y:9,width:pw,height:ph,fill:"#000",opacity:".3"},g);
  el("rect",{x:-pw/2,y:0,width:pw,height:ph,fill:"#f6f2e8"},g);
  nest(c.n,c.pv,-pw/2+14,14,pw-28,(pw-28)*c.pv[3]/c.pv[2],g);
  const t=el("text",{x:0,y:ph-13,"text-anchor":"middle","font-family":"Yellowtail","font-size":24,fill:"#2a2521"},g);
  t.textContent=c.cap;
  el("circle",{cx:0,cy:10,r:8,fill:"#a8210f"},g);
  el("circle",{cx:-2.5,cy:7.5,r:3,fill:"#e03a20"},g);
  pols.push({e:g,base:tf,rot:rot,ph:R(0,6),sp:R(.5,.8)});
 });
 // what the camera keeps in view: the sheet, and the polaroids hanging off its foot
 const foot=crew.length?Math.max(by+bh,by+bh-70+16+9+ph):by+bh;
 box={x:bx+bw/2,y:(by+foot)/2,w:bw+40,h:foot-by};fit();
 strings=[...content.querySelectorAll(".string")];
 const g0=gen;
 strings.forEach((s,i)=>T(()=>{if(g0===gen)pin(s,2600);},1500+i*2200));
 T(()=>repin(g0),R(60,90)*1000);
}

// ---- protocol: ask the parent for the score; accept it only from the parent, on this origin ----
if(parent!==window){
 addEventListener("message",e=>{
  if(!(e.source === parent && e.origin === location.origin && e.data && e.data.type === "b68:score"))return;
  try{show(e.data);}catch(err){}
 });
 try{parent.postMessage({type:"b68:ready"},location.origin);}catch(e){}
}
requestAnimationFrame(frame);
})();
</script>
